name: ruma
description: Mengelola waktu dan uang pribadi, dibantu asisten AI.
publish_to: none
version: 0.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.0.0
  crypto: 3.0.7
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  image_picker: 1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - design/assets/ruma/assistant/
    - design/assets/ruma/brand/
    - design/assets/ruma/icons/
    - design/assets/ruma/mascot/
    - design/assets/ruma/illustrations/
  fonts:
    - family: Manrope
      fonts:
        - asset: design/assets/ruma/fonts/Manrope-Variable.ttf
          weight: 100
        - asset: design/assets/ruma/fonts/Manrope-Variable.ttf
          weight: 200
        - asset: design/assets/ruma/fonts/Manrope-Variable.ttf
          weight: 300
        - asset: design/assets/ruma/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: design/assets/ruma/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: design/assets/ruma/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: design/assets/ruma/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: design/assets/ruma/fonts/Manrope-Variable.ttf
          weight: 800
